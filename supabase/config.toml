[auth]
# zweikampf ist eine private Zwei-Personen-Anwendung. Weitere Konten werden
# ausschliesslich kontrolliert ueber die Projektverwaltung eingeladen.
enable_signup = false
enable_anonymous_sign_ins = false

[functions.schlaf-import]
verify_jwt = false

[functions.fokus]
verify_jwt = false

[functions.push-test]
verify_jwt = true

[functions.schlaf-erinnerung]
verify_jwt = false

[functions.gewicht-erinnerung]
verify_jwt = false

# Eigener Vault-Schluessel, im Handler gegen einen serverseitigen Hash geprueft.
[functions.aktivitaets-erinnerung]
verify_jwt = false

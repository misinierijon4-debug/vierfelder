name: rollen-popup
on:
  pull_request:
    paths:
      - 'src/components/eni/EniRollenwahl.tsx'
      - 'src/components/eni/EniApp.tsx'
      - 'src/index.css'
      - 'scripts/check-eni-rollen-browser.mjs'
      - '.github/workflows/eni-popup.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Testbrowser installieren
        run: |
          npm install --prefix "$RUNNER_TEMP/eni-browser" --no-audit --no-fund playwright@1.56.1
          node "$RUNNER_TEMP/eni-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Rollenpopup auf mobilen Bildschirmgroessen pruefen
        run: |
          npm run dev -- --host 127.0.0.1 --port 5207 > /tmp/eni-vite.log 2>&1 &
          trap 'kill $!' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5207/ >/dev/null; then break; fi
            sleep 1
          done
          ENI_PLAYWRIGHT="$RUNNER_TEMP/eni-browser/node_modules/playwright" node scripts/check-eni-rollen-browser.mjs

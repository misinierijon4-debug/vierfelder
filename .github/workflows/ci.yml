name: pruefung

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: pruefung-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check:agentendoku
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:edge
      # Mit Supabase-Chunk messen, damit der Main-Deploy dasselbe Budget prüft.
      - run: npm run build:pages
        env:
          VITE_BASE: /vierfelder/
          VITE_SUPABASE_URL: https://ogxwazageufvalkocywh.supabase.co
          # Öffentliches Platzhalterformat; für den statischen Budgetbau keine Anmeldung.
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_x
          CHECK_NO_SERVER: '1'
